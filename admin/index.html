<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Admin pages must never show up in Google -->
    <meta name="robots" content="noindex, nofollow" />
    <title>ShopVerse Admin</title>
    <!--
      Start-up loader: the same design as the store's (see frontend/index.html for the details).
      Plain HTML + CSS so it shows before the JavaScript arrives; src/main.jsx fades it out.

      One 4.4 s cycle, four 1.1 s turns:
        cart + "orders"   box + "products"   chart + "analytics"   people + "customers"
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        background: #f1f5f9; /* slate-100, the admin page background */
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        visibility: hidden;
      }

      /* Section icon: hops every turn and changes with the word */
      .splash-icons {
        position: relative;
        width: 56px;
        height: 56px;
        color: #4f46e5;
        animation: splash-hop 1.1s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      .splash-icons svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        animation: splash-icon 4.4s linear infinite;
      }
      .splash-icons svg:nth-child(1) { animation-delay: 0s; }
      .splash-icons svg:nth-child(2) { animation-delay: -3.3s; }
      .splash-icons svg:nth-child(3) { animation-delay: -2.2s; }
      .splash-icons svg:nth-child(4) { animation-delay: -1.1s; }
      @keyframes splash-icon {
        0% { opacity: 0; transform: translateY(6px) scale(0.9); }
        6% { opacity: 1; transform: translateY(0) scale(1); }
        20% { opacity: 1; transform: translateY(0) scale(1); }
        25% { opacity: 0; transform: translateY(-6px) scale(0.9); }
        100% { opacity: 0; }
      }
      @keyframes splash-hop {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        30% { transform: translateY(-10px) scale(0.96, 1.04); }
        55% { transform: translateY(0) scale(1.05, 0.95); }
        70% { transform: translateY(-3px) scale(1, 1); }
      }

      /* Brand: the shield outline draws itself once (pathLength="100" + dash offset) */
      .splash-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #0f172a;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .splash-brand svg {
        width: 28px;
        height: 28px;
        color: #4f46e5;
      }
      .splash-brand svg path {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: splash-draw 0.9s ease-out forwards;
      }
      .splash-brand svg path:nth-child(2) { animation-delay: 0.5s; } /* the tick comes after the shield */
      @keyframes splash-draw {
        to { stroke-dashoffset: 0; }
      }

      .splash-bar {
        position: relative;
        width: 140px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e0e7ff;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #4f46e5;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }

      .splash-text {
        margin: 0;
        color: #64748b;
        font-size: 14px;
        line-height: 20px;
        text-align: center;
      }
      .splash-words {
        display: inline-block;
        height: 20px;
        overflow: hidden;
        vertical-align: bottom;
        color: #4f46e5;
        font-weight: 600;
      }
      .splash-words span {
        display: block;
        height: 20px;
        animation: splash-words 4.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-words {
        0%, 20% { transform: translateY(0); }
        25%, 45% { transform: translateY(-20px); }
        50%, 70% { transform: translateY(-40px); }
        75%, 95% { transform: translateY(-60px); }
        100% { transform: translateY(-80px); }
      }

      /* Only on slow connections (or while the free server wakes up): a hint after 6 seconds */
      .splash-slow {
        margin: 0;
        color: #94a3b8;
        font-size: 12px;
        opacity: 0;
        animation: splash-fade-in 0.6s ease 6s forwards;
      }
      @keyframes splash-fade-in {
        to { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-icons,
        .splash-icons svg,
        .splash-bar::after,
        .splash-words span {
          animation: none;
        }
        .splash-icons svg:first-child { opacity: 1; }
        .splash-brand svg path {
          animation: none;
          stroke-dashoffset: 0;
        }
        .splash-bar::after {
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Loading ShopVerse Admin">
      <div class="splash-icons" aria-hidden="true">
        <!-- orders -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1" />
          <circle cx="19" cy="21" r="1" />
          <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
        </svg>
        <!-- products -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
          <path d="M12 22V12" />
          <path d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" />
          <path d="m7.5 4.27 9 5.15" />
        </svg>
        <!-- analytics -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v16a2 2 0 0 0 2 2h16" />
          <path d="M18 17V9" />
          <path d="M13 17V5" />
          <path d="M8 17v-3" />
        </svg>
        <!-- customers -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      </div>

      <div class="splash-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path pathLength="100" d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <path pathLength="100" d="m9 12 2 2 4-4" />
        </svg>
        ShopVerse Admin
      </div>

      <div class="splash-bar" aria-hidden="true"></div>

      <p class="splash-text" aria-hidden="true">
        Loading
        <span class="splash-words"><span>orders</span><span>products</span><span>analytics</span><span>customers</span><span>orders</span></span>
      </p>

      <p class="splash-slow">Slow connection? Almost there…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
