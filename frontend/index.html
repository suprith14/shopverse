<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SITE_NAME%</title>
    <!--
      Start-up loader. Plain HTML + CSS on purpose: it shows the instant this small file arrives,
      while the app's JavaScript is still downloading. (A React spinner could only appear AFTER
      that JavaScript loaded, leaving a blank white page first.) src/main.jsx fades it out as soon
      as the app has rendered. No minimum time: it never makes a visit slower.

      Everything runs on one 3.3 s cycle split into three 1.1 s turns:
        turn 1: phone + "gadgets"   turn 2: book + "books"   turn 3: lamp + "home decor"
    -->
    <!-- Theme BEFORE anything is painted, so dark-mode visitors never see a white flash.
         Same rules as src/lib/theme.js: a saved choice, otherwise the device setting. -->
    <script>
      try {
        var theme = localStorage.getItem('shopverse:theme');
        if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/src/splash.css" />
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Loading %SITE_NAME%">
      <!-- 1. Category icons (one visible at a time, in sync with the word below) -->
      <div class="splash-icons" aria-hidden="true">
        <!-- gadgets -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
          <path d="M12 18h.01" />
        </svg>
        <!-- books -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7v14" />
          <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
        </svg>
        <!-- home decor -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2h8l4 10H4L8 2Z" />
          <path d="M12 12v6" />
          <path d="M8 22v-2c0-1.1.9-2 2-2h4a2 2 0 0 1 2 2v2H8Z" />
        </svg>
      </div>

      <!-- 2. Brand: the bag outline draws itself -->
      <div class="splash-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path pathLength="100" d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
          <path pathLength="100" d="M3 6h18" />
          <path pathLength="100" d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        %SITE_NAME%
      </div>

      <div class="splash-bar" aria-hidden="true"></div>

      <!-- Visual only: screen readers already hear "Loading %SITE_NAME%" from role="status" above -->
      <p class="splash-text" aria-hidden="true">
        Getting
        <span class="splash-words"><span>gadgets</span><span>books</span><span>home decor</span><span>gadgets</span></span>
        ready
      </p>

      <!-- 3. Fades in only if loading takes longer than 6 seconds -->
      <p class="splash-slow">Slow connection? Almost there…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
