<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopVerse</title>
    <!--
      Start-up loader. Plain HTML + CSS on purpose: it shows the instant this small file arrives,
      while the app's JavaScript is still downloading. (A React spinner could only appear AFTER
      that JavaScript loaded, leaving a blank white page first.) src/main.jsx fades it out as soon
      as the app has rendered. No minimum time: it never makes a visit slower.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f8fafc; /* same as the page background, so the hand-over is seamless */
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #splash.splash-hide {
        opacity: 0;
        visibility: hidden;
      }
      .splash-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #0f172a;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .splash-logo svg {
        width: 40px;
        height: 40px;
        color: #4f46e5;
        animation: splash-bounce 1.2s ease-in-out infinite;
        transform-origin: 50% 100%;
      }
      /* The bag "hops", like it's being packed */
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        30% { transform: translateY(-10px) scale(0.96, 1.04); }
        55% { transform: translateY(0) scale(1.05, 0.95); }
        70% { transform: translateY(-3px) scale(1, 1); }
      }
      /* A slim bar sliding left to right underneath */
      .splash-bar {
        position: relative;
        width: 140px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e0e7ff;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #4f46e5;
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      .splash-text {
        margin: 0;
        color: #64748b;
        font-size: 13px;
      }
      /* People who turned animations off on their device get a calm, still loader */
      @media (prefers-reduced-motion: reduce) {
        .splash-logo svg,
        .splash-bar::after {
          animation: none;
        }
        .splash-bar::after {
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Loading ShopVerse">
      <div class="splash-logo">
        <!-- shopping bag (same icon as the header logo) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
          <path d="M3 6h18" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        ShopVerse
      </div>
      <div class="splash-bar" aria-hidden="true"></div>
      <p class="splash-text">Loading your store…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
